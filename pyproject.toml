[project]
name = "magic-music-player-mmp"
version = "0.1.0"
description = "Ultra-lightweight desktop music search, streaming, and download app."
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "yt-dlp>=2026.8.19",
    "python-mpv>=1.0.7",
    "pillow>=10.4.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mmp = "mmp.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
